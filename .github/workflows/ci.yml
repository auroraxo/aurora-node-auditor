name: CI & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run test suite
        run: |
          uv run --python ${{ matrix.python-version }} --with pytest pytest -v --ignore=tests/test_packaging.py

      - name: Verify wheel installation and advertised CLIs
        run: |
          uv run --python ${{ matrix.python-version }} --with pytest pytest -v tests/test_packaging.py
