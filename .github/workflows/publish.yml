name: Publish release

on:
  release:
    types: [published]

# The project is intentionally not on PyPI: installs go through the PEP 503
# index on codebyaurora.com, git, and the wheel attached to this release
# (README install route 3). The old OIDC publish step only produced failing
# runs, so this workflow now builds the distributions and attaches them to
# the GitHub release instead.
permissions:
  contents: write

jobs:
  assets:
    name: Build and attach release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build distributions
        run: uv build

      - name: Attach wheel and sdist to the release
        env:
          GH_TOKEN: *** github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
