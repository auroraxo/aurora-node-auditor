name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish (e.g. 0.1.6)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push multi-arch image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            v="${GITHUB_REF_NAME#v}"
            echo "version=${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/aurora-node-auditor:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aurora-node-auditor:latest
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test the pushed amd64 image
        run: |
          set -eux
          img="ghcr.io/${{ github.repository_owner }}/aurora-node-auditor:${{ steps.ver.outputs.version }}"
          docker run -d --name auditor -p 8787:8787 "$img"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/health
          curl -fsS http://127.0.0.1:8787/ready
          curl -fsS http://127.0.0.1:8787/telemetry | head -c 400
          curl -fsS http://127.0.0.1:8787/metrics | head -5
          docker rm -f auditor
