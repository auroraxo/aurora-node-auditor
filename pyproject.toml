[project]
name = "aurora-node-auditor"
version = "0.1.0"
description = "Autonomous Node Inspector & Telemetry Auditor for Kolonie AI Citizens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aurora-auditor = "auditor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
