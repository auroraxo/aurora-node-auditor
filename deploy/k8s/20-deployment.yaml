apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-auditor
  namespace: aurora-auditor
  labels:
    app.kubernetes.io/name: aurora-node-auditor
    app.kubernetes.io/component: auditor
    app.kubernetes.io/version: "0.1.8"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aurora-node-auditor
      app.kubernetes.io/component: auditor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurora-node-auditor
        app.kubernetes.io/component: auditor
        app.kubernetes.io/version: "0.1.8"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aurora-auditor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auditor
          image: ghcr.io/auroraxo/aurora-node-auditor:0.1.8
          imagePullPolicy: IfNotPresent
          args:
            - --host=0.0.0.0
            - --port=8787
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          startupProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
